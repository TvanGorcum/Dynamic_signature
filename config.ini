[signature]
# Fill in the values below to personalize the Outlook signature.
name = Naam Achternaam
function = EIRES Functie

[paths]
# The template is updated by the git pull step before generation.
template_path = templates/signature_template.html

# Intermediate generated file inside this repository.
generated_output_path = output/personalized_signature.html

# Final destination for the personalized signature HTML file.
# Change this to your Outlook signatures folder or any other deployment path.
copy_to_path = output/outlook_signature.html

[workflow]
# Pull the current branch before generating the signature.
run_git_pull = true

# Keep local/offline development usable when the branch has no upstream remote.
allow_git_pull_failure = true
